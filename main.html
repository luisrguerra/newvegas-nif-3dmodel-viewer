<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador NIF – Fallout New Vegas</title>
<style>
:root{--bg:#14161a;--fg:#e6e2d3;--ac:#e0a526;--pn:#1d2026;--bd:#2c313a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas:active{cursor:grabbing}
#uvc{inset:auto;right:10px;bottom:10px;width:256px;height:256px;cursor:default;display:none;z-index:2;border:1px solid var(--bd);border-radius:8px}
.bar{position:fixed;top:10px;left:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--pn);border:1px solid var(--bd);padding:8px 10px;border-radius:8px;z-index:2}
button,label.b{background:var(--ac);color:#1a1405;border:0;padding:6px 12px;border-radius:5px;font-weight:600;cursor:pointer}
label.c{display:flex;gap:4px;align-items:center;cursor:pointer}
#info{max-height:45vh;overflow:auto;position:fixed;left:10px;bottom:10px;background:var(--pn);border:1px solid var(--bd);padding:8px 10px;border-radius:8px;font:12px ui-monospace,monospace;white-space:pre;z-index:2;max-width:90vw}
#drop{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:20px;opacity:.6;text-align:center}
#drop.h{display:none}
#drop.over{background:#e0a52633;opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="bar">
  <label class="b">Abrir .nif / texturas<input id="file" type="file" accept=".nif,.dds,.png,.jpg,.jpeg,.webp" multiple hidden></label>
  <label class="c"><input id="wire" type="checkbox" checked> Wireframe</label>
  <label class="c"><input id="solid" type="checkbox" checked> Sólido</label>
  <label class="c"><input id="tex" type="checkbox" checked> Texturas</label>
  <label class="c"><input id="flipv" type="checkbox"> Inverter V</label>
  <button id="reset">Resetar câmera</button>
</div>
<div id="info">Nenhum modelo carregado</div>
<canvas id="uvc" width="256" height="256"></canvas>
<div id="drop">Arraste um .nif aqui (junto com os .dds, se quiser texturas)<br><small>Fallout 3 / New Vegas (NIF 20.2.0.7)</small></div>

  const L = new Uint32Array(r.idx.length * 2);
  for (let k = 0; k < r.idx.length; k += 3) { L.set([r.idx[k], r.idx[k+1], r.idx[k+1], r.idx[k+2], r.idx[k+2], r.idx[k]], k * 2); }
  geo = { vb: mkBuf(r.verts, GPUBufferUsage.VERTEX), ib: mkBuf(r.idx, GPUBufferUsage.INDEX), lb: mkBuf(L, GPUBufferUsage.INDEX), ni: r.idx.length, nl: L.length, g: r.groups.map(mkGroup) };
  if (keep) return;
  cam.target = r.mn.map((v, i) => (v + r.mx[i]) / 2);
  cam.rad = Math.hypot(...r.mn.map((v, i) => r.mx[i] - v)) / 2 || 1;
  resetCam();
}
function resetCam() { cam.yaw = 0.6; cam.pitch = 0.35; cam.dist = cam.rad * 2.6; }

function frame() {
  if (dev && depth) {
    const asp = cv.width / cv.height, cp = Math.cos(cam.pitch);
    const dir = [cp * Math.sin(cam.yaw), Math.sin(cam.pitch), cp * Math.cos(cam.yaw)];
    const eye = cam.target.map((t, i) => t + dir[i] * cam.dist);
    const vp = M.mul(M.persp(Math.PI / 4, asp, cam.rad * 0.01, cam.rad * 50), M.look(eye, cam.target, [0, 1, 0]));
    const ld = [dir[0] + 0.3, dir[1] + 0.5, dir[2] + 0.2], ll = Math.hypot(...ld);
    dev.queue.writeBuffer(ubuf, 0, vp); dev.queue.writeBuffer(ubuf, 64, new Float32Array([ld[0]/ll, ld[1]/ll, ld[2]/ll, $('tex').checked ? 1 : 0])); dev.queue.writeBuffer(ubuf, 80, new Float32Array([$('flipv').checked ? 1 : 0, 0, 0, 0]));
    const enc = dev.createCommandEncoder();
    const pass = enc.beginRenderPass({
      colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0.08, g: 0.09, b: 0.1, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
      depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } });
    if (geo) {
      pass.setVertexBuffer(0, geo.vb);
      if ($('solid').checked) { pass.setPipeline(pSolid); pass.setBindGroup(0, bind); pass.setIndexBuffer(geo.ib, 'uint32'); for (const g of geo.g) { pass.setBindGroup(1, g.bg); pass.drawIndexed(g.c, 1, g.s); } }
      if ($('wire').checked) { pass.setPipeline(pWire); pass.setBindGroup(0, bind); pass.setIndexBuffer(geo.lb, 'uint32'); pass.drawIndexed(geo.nl); }
    }
    pass.end(); dev.queue.submit([enc.finish()]);
  }
  requestAnimationFrame(frame);
}

// ---------- Entrada ----------
let cur = null;
function drawUV() {
  const r = cur, c = $('uvc'); if (!r) return; const g = c.getContext('2d'), S = 256, fl = $('flipv').checked, q = r.groups.find(q => imgs.has(q.tex));
  c.style.display = 'block'; g.fillStyle = '#222'; g.fillRect(0, 0, S, S); if (q) g.drawImage(imgs.get(q.tex), 0, 0, S, S);
  g.strokeStyle = 'rgba(255,170,0,.9)'; g.lineWidth = 1;
  for (let k = 0; k < r.idx.length; k += 3) { g.beginPath(); for (let j = 0; j < 3; j++) { const a = r.idx[k + j] * 8 + 6, v = r.verts[a + 1], x = r.verts[a] * S, y = (fl ? 1 - v : v) * S; j ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); g.stroke(); }
}
$('flipv').onchange = drawUV;
function showInfo(errs = []) {
  const r = cur; if (!r) return;
  const tn = [...new Set(r.groups.map(g => g.tex).filter(Boolean))];
  info.textContent = `${r.fn}\n${r.line}\nMalhas: ${r.nm}  Vértices: ${r.nv}  Triângulos: ${r.tris}` +
    (r.skipped ? `\nIgnoradas (geometria em BSPackedAdditionalGeometryData, não suportada): ${r.skipped}` : '') +
    '\nTexturas: ' + (tn.length ? tn.map(n => n + (lib.has(n) ? ' ✓' : ' ✗')).join(', ') + (tn.some(n => !lib.has(n)) ? '  (arraste os .dds junto)' : '') : 'nenhuma referenciada') +
    '\nBlocos: ' + Object.entries(r.counts).map(([k, v]) => `${k}×${v}`).join(', ') + (errs.length ? '\n' + errs.join('\n') : '');
}
async function loadFiles(fl) {
  fl = [...fl]; const nf = fl.find(f => /\.nif$/i.test(f.name)), errs = [];
  for (const f of fl) if (/\.(dds|png|jpe?g|webp)$/i.test(f.name)) try { await loadTex(f); } catch (e) { errs.push(f.name + ': ' + e.message); }
  try {
    if (nf) { cur = parseNif(await nf.arrayBuffer()); cur.fn = nf.name; setModel(cur); $('drop').classList.add('h'); }
    else if (cur) setModel(cur, true); else throw new Error('Abra um arquivo .nif primeiro');
    showInfo(errs); drawUV();
  } catch (e) { info.textContent = 'Erro: ' + e.message; console.error(e); }
}
$('file').onchange = e => loadFiles(e.target.files);
$('reset').onclick = resetCam;
addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
addEventListener('dragleave', () => $('drop').classList.remove('over'));
addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); loadFiles(e.dataTransfer.files); });
const ptr = new Map();
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, e); });
cv.addEventListener('pointerup', e => ptr.delete(e.pointerId));
cv.addEventListener('pointermove', e => {
  const p = ptr.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.clientX, dy = e.clientY - p.clientY; ptr.set(e.pointerId, e);
  if (e.buttons & 2 || e.shiftKey) { // pan
    const k = cam.dist * 0.0015, cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const rx = [cy, 0, -sy], up = [0, 1, 0];
    cam.target = cam.target.map((t, i) => t - rx[i] * dx * k + up[i] * dy * k);
  } else { cam.yaw -= dx * 0.008; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * 0.008)); }
});
cv.addEventListener('wheel', e => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY * 0.001); }, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());

initGPU().then(frame).catch(e => { info.textContent = 'Erro: ' + e.message; });
</script>
</body>
</html>
